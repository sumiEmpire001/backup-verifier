[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lord-sumi-backup-verifier"
version = "0.1.0"
description = "Content-addressed local backups with verified restore rehearsals"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
backup-verifier = "backup_verifier.__main__:main"

[tool.setuptools.packages.find]
include = ["backup_verifier*"]
