name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

      - name: Run sample scenario
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir demo-source
          printf 'Synthetic backup demonstration\n' > demo-source/hello.txt
          python -m backup_verifier create demo-source demo-backup
          python -m backup_verifier verify demo-backup
          python -m backup_verifier restore demo-backup demo-restored
          cmp demo-source/hello.txt demo-restored/hello.txt
